[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lights"
version = "0.1.0"
description = "Brightness controller for two monitors via ddcutil"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70",
]

[project.scripts]
lights = "lights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lights*"]

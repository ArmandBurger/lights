[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lights"
version = "0.1.0"
description = "Brightness controller for two monitors via ddcutil"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Armand Burger" }]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70",
]

[project.scripts]
lights = "lights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lights*"]

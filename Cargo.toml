[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lights"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["Armand Burger"]
repository = "https://github.com/ArmandBurger/lights"

[workspace.dependencies]
lights-core = { path = "crates/lights-core" }
lights-tui = { path = "crates/lights-tui" }
lights-gui = { path = "crates/lights-gui" }
async-channel = "=2.5.0"
clap = { version = "=4.6.7", features = ["derive"] }
glib-build-tools = "=0.22.8"
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
ratatui = "=0.30.2"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
toml_edit = "=0.25.17"

[profile.release]
opt-level = "z" # Smol
debug = false
strip = true
lto = true
codegen-units = 1
[package]
name = "lights"
description = "Adjust your external monitors' brightness from Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The desktop UI bundles MIT-licensed icons (Fluent UI System Icons).
license = "GPL-3.0-or-later AND MIT"
authors.workspace = true
repository.workspace = true
default-run = "lights"

[features]
default = ["tui", "gui"]
tui = ["dep:lights-tui"]
gui = ["dep:lights-gui"]

[dependencies]
lights-core.workspace = true
lights-tui = { workspace = true, optional = true }
lights-gui = { workspace = true, optional = true }
clap.workspace = true
serde_json.workspace = true

[[bin]]
name = "lights-gui"
path = "src/bin/lights-gui.rs"
required-features = ["gui"]

[package.metadata.deb]
maintainer = "Armand Burger <22417562+ArmandBurger@users.noreply.github.com>"
copyright = "2026, Armand Burger"
extended-description = "Set every monitor at once, link them or pick a preset, from the terminal or the desktop."
section = "utils"
priority = "optional"
depends = "$auto, ddcutil (>= 1.4.1)"
assets = [
    ["target/release/lights", "usr/bin/", "755"],
    ["target/release/lights-gui", "usr/bin/", "755"],
    ["assets/io.github.armandburger.lights.desktop", "usr/share/applications/", "644"],
    ["../lights-gui/assets/icons/hicolor/scalable/apps/io.github.armandburger.lights.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../applet/lights@armandburger/applet.js", "usr/share/cinnamon/applets/lights@armandburger/", "644"],
    ["../../applet/lights@armandburger/metadata.json", "usr/share/cinnamon/applets/lights@armandburger/", "644"],
    ["../../README.md", "usr/share/doc/lights/", "644"],
    ["../../THIRD_PARTY_NOTICES.md", "usr/share/doc/lights/", "644"],
]
